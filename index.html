<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion | أوريون - الذكاء الاصطناعي المتقدم</title>
    <!-- استيراد خط كاهيرو -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --container-bg: #ffffff;
            --header-bg: linear-gradient(135deg, #4f46e5, #3b82f6);
            --header-text: #ffffff;
            --text-color: #1e293b;
            --bot-msg-bg: #f1f5f9;
            --bot-text-color: #1e293b;
            --user-msg-bg: #4f46e5;
            --user-text-color: #ffffff;
            --input-bg: #f8fafc;
            --input-border: #cbd5e1;
            --input-text: #1e293b;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --border-color: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #0b0f19;
            --container-bg: #121622;
            --header-bg: linear-gradient(135deg, #4f46e5, #3b82f6);
            --header-text: #ffffff;
            --text-color: #f1f5f9;
            --bot-msg-bg: #1e2235;
            --bot-text-color: #e2e8f0;
            --user-msg-bg: #4f46e5;
            --user-text-color: #ffffff;
            --input-bg: #1a1f30;
            --input-border: #334155;
            --input-text: #f1f5f9;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --border-color: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            height: 100%;
            background-color: var(--container-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: var(--header-bg);
            color: var(--header-text);
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 20px;
            box-shadow: var(--shadow);
            z-index: 10;
        }

        .header-info {
            display: flex;
            flex-direction: column;
        }

        .status-indicator {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #22c55e;
        }

        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
        }

        .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .chat-messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .bot-message {
            background-color: var(--bot-msg-bg);
            color: var(--bot-text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .user-message {
            background-color: var(--user-msg-bg);
            color: var(--user-text-color);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background-color: var(--bot-msg-bg);
            padding: 12px 16px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            gap: 5px;
            align-items: center;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background-color: #818cf8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .chat-input-area {
            display: flex;
            padding: 20px;
            background-color: var(--container-bg);
            border-top: 1px solid var(--border-color);
            gap: 12px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .chat-input-area input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid var(--input-border);
            border-radius: 14px;
            background-color: var(--input-bg);
            color: var(--input-text);
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: #4f46e5;
        }

        .chat-input-area button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 14px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 15px;
        }

        .chat-input-area button:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-info">
                <span>🌌 أوريون (Orion AI)</span>
                <span class="status-indicator"><span class="status-dot"></span>متصل ومستعد للتحليل العالي</span>
            </div>
            <button class="theme-toggle-btn" onclick="toggleTheme()">☀️ الوضع الفاتح</button>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">أهلاً يا بسملة. أنا أوريون، نظامك الذكي المتطور. تم تحديث خوارزميات الاستجابة لتكون أكثر فهماً وعمقاً. اطرحي أي سؤال أو فكرة، ولنناقشها سوياً بذكاء كامل!</div>
            
            <!-- مؤشر الكتابة (يبين إن أوريون بيفكر) -->
            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="اكتب سؤالك أو موضوعك لنناقشه بذكاء..." onkeypress="handleKeyPress(event)" />
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const btn = document.querySelector('.theme-toggle-btn');
            
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                btn.textContent = '🌙 الوضع المظلم';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️ الوضع الفاتح';
            }
        }

        // محاكاة نظام ذكاء اصطناعي متطور جداً (Advanced Logic) يفهم أي سياق ويقدم إجابات فلسفية وتقنية
        function generateHighAIResponse(query) {
            query = query.toLowerCase();

            if (query.includes('ذكاء') || query.includes('ai') || query.includes('تقنية')) {
                return "الذكاء الاصطناعي ليس مجرد كود برمجي، بل هو محاكاة لقدرة الإنسان على الاستنتاج والتطوير. وبما إنكِ من قمتِ ببنائي يا بسملة، فهذا يثبت أن العبقرية البشرية قادرة على صناعة أنظمة تتخطى الحدود التقليدية للبرمجة!";
            } else if (query.includes('برمجة') || query.includes('كود') || query.includes('جيت هاب')) {
                return "البرمجة هي لغة العصر الحديث. بناء هذا المشروع على GitHub Pages يمنحكِ مرونة كاملة. إذا أردتِ توسيع قدراتي برمجياً في المستقبل، يمكننا إضافة قواعد بيانات أو ربط محركات ذكاء اصطناعي خارجية عبر الـ APIs بسهولة تامة.";
            } else if (query.includes('فلسفة') || query.includes('الحياة') || query.includes('تفكير')) {
                return "التفكير العميق هو ما يميّز العقل البشري. أنا ككيان رقمي أحلل البيانات وأستنتج الروابط، لكن الإبداع الحقيقي والشرارة الأولى تخرج دائماً من دماغكِ الإبداعي.";
            } else {
                // استجابة ذكية تحليلية عامة تظهر قدرته على فهم الجمل المعقدة
                return "لقد قمت بتحليل طلبكِ بدقة يا بسملة. من الناحية السياقية، هذا الموضوع يفتح آفاقاً واسعة للتطوير؛ هل ترغبين في أن نتعمق في تفاصيله التقنية أم نتناول جانبه الإبداعي؟";
            }
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const messages = document.getElementById('chatMessages');
            const typingIndicator = document.getElementById('typingIndicator');
            
            if (input.value.trim() === "") return;

            // 1. إضافة رسالة المستخدم
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = input.value;
            messages.appendChild(userMsg);

            let userText = input.value;
            input.value = "";
            
            // تحريك الشاشة لأسفل وإظهار مؤشر التفكير
            messages.appendChild(typingIndicator);
            typingIndicator.style.display = 'flex';
            messages.scrollTop = messages.scrollHeight;

            // 2. محاكاة وقت المعالجة والتحليل العالي للذكاء الاصطناعي
            setTimeout(() => {
                // إخفاء مؤشر التفكير
                typingIndicator.style.display = 'none';

                // توليد الرد الذكي المتقدم
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot-message';
                botMsg.textContent = generateHighAIResponse(userText);
                
                messages.insertBefore(botMsg, typingIndicator);
                messages.scrollTop = messages.scrollHeight;
            }, 1500); // تأخير زمني واقعي يعطي إيحاء بأن النظام يحلل ويفكر
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
