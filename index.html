<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion | أوريون - صديقك الرقمي</title>
    <!-- استيراد خط كاهيرو العربي العصري -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            max-height: 700px;
            background-color: #1e1e2f;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .chat-header {
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            padding: 20px;
            text-align: center;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .bot-message {
            background-color: #2a2b42;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .user-message {
            background-color: #4f46e5;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            background-color: #151823;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #334155;
            border-radius: 12px;
            background-color: #1e1e2f;
            color: #f1f5f9;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .chat-input-area input:focus {
            border-color: #4f46e5;
        }
        .chat-input-area button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        .chat-input-area button:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">🌌 أوريون (Orion)</div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">أهلاً بيكِ يا بسملة! أنا أوريون، صديقك الرقمي ومساعدك الذكي. جاهز أسمعك وأدردش معاكي، قوليلي حابة نتكلم في إيه النهاردة؟</div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)" />
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const messages = document.getElementById('chatMessages');
            
            if (input.value.trim() === "") return;

            // 1. إضافة رسالة المستخدم
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = input.value;
            messages.appendChild(userMsg);

            let text = input.value;
            input.value = "";
            messages.scrollTop = messages.scrollHeight;

            // 2. رد ذكي تفاعلي من أوريون (قريباً هنربطه بعقل ذكي متقدم)
            setTimeout(() => {
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot-message';
                botMsg.textContent = "أنا سمعت كلامك ومركز معاكي جداً.. الشغل ماشي تمام ومستعد للخطوة الجاية!";
                messages.appendChild(botMsg);
                messages.scrollTop = messages.scrollHeight;
            }, 1000);
        }

        // إمكانية الإرسال بالضغط على زر Enter من لوحة المفاتيح
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
