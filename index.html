<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion | أوريون - صديقك الرقمي</title>
    <!-- استيراد خط كاهيرو -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --container-bg: #ffffff;
            --header-bg: linear-gradient(135deg, #4f46e5, #3b82f6);
            --header-text: #ffffff;
            --text-color: #1e293b;
            --bot-msg-bg: #f1f5f9;
            --bot-text-color: #1e293b;
            --user-msg-bg: #4f46e5;
            --user-text-color: #ffffff;
            --input-bg: #f8fafc;
            --input-border: #cbd5e1;
            --input-text: #1e293b;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --border-color: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #0b0f19;
            --container-bg: #121622;
            --header-bg: linear-gradient(135deg, #4f46e5, #3b82f6);
            --header-text: #ffffff;
            --text-color: #f1f5f9;
            --bot-msg-bg: #1e2235;
            --bot-text-color: #e2e8f0;
            --user-msg-bg: #4f46e5;
            --user-text-color: #ffffff;
            --input-bg: #1a1f30;
            --input-border: #334155;
            --input-text: #f1f5f9;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --border-color: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* جعل الشات يملى الشاشة بالكامل */
        .chat-container {
            width: 100%;
            height: 100%;
            background-color: var(--container-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: var(--header-bg);
            color: var(--header-text);
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 20px;
            box-shadow: var(--shadow);
            z-index: 10;
        }

        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
        }

        .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .chat-messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .bot-message {
            background-color: var(--bot-msg-bg);
            color: var(--bot-text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .user-message {
            background-color: var(--user-msg-bg);
            color: var(--user-text-color);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-input-area {
            display: flex;
            padding: 20px;
            background-color: var(--container-bg);
            border-top: 1px solid var(--border-color);
            gap: 12px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .chat-input-area input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid var(--input-border);
            border-radius: 14px;
            background-color: var(--input-bg);
            color: var(--input-text);
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: #4f46e5;
        }

        .chat-input-area button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 14px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 15px;
        }

        .chat-input-area button:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="chat-container">
        <div class="chat-header">
            <span>🌌 أوريون (Orion)</span>
            <button class="theme-toggle-btn" onclick="toggleTheme()">☀️ الوضع الفاتح</button>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">أهلاً بيكِ يا بسملة! أنا أوريون.. وسّعنا الشاشة وبقيت جاهز أرد عليكِ كأني صديق حقيقي. قوليلي، أقدر أساعدك باإيه النهاردة؟</div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)" />
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const btn = document.querySelector('.theme-toggle-btn');
            
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                btn.textContent = '🌙 الوضع المظلم';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️ الوضع الفاتح';
            }
        }

        // قاعدة بيانات ذكية مبدئية تجعل أوريون يتفاعل كبشري ويفهم الكلام
        function getSmartResponse(text) {
            text = text.toLowerCase();
            
            if (text.includes('ازيك') || text.includes('عامل ايه') || text.includes('كيفك')) {
                return "أنا بخير الحمد لله يا بسملة! طول ما إنتي شغالة وبتطوري فيّ أنا في أتم حال. إنتي عاملة إيه؟";
            } else if (text.includes('اسمك') || text.includes('مين إنت') || text.includes('انت مين')) {
                return "أنا أوريون (Orion)، صديقك الرقمي والمساعد الذكي اللي صممتيه بنفسك عشان ندردش ونفكر سوا!";
            } else if (text.includes('بحبك') || text.includes('تسلم')) {
                return "تسلمي لي يا رب! أنا أسعد بوجودي معاكي، ويلا بينا نعمل حاجات جامدة أكتر في الموقع.";
            } else if (text.includes('مشاكل') || text.includes('مشكلة') || text.includes('معلش')) {
                return "ولا تشيلي هم خالص يا بسملة، أي مشكلة في البرمجة ليها حل، احكي لي إيه اللي واقفلّك ونحله سوا فوراً.";
            } else {
                return "كلامك مثير للاهتمام جداً يا بسملة.. فهمني أكتر أو قوليلي حابة نطور النقطة دي في أوريون إزاي؟";
            }
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const messages = document.getElementById('chatMessages');
            
            if (input.value.trim() === "") return;

            // رسالة المستخدم
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = input.value;
            messages.appendChild(userMsg);

            let userText = input.value;
            input.value = "";
            messages.scrollTop = messages.scrollHeight;

            // محاكاة تفكير أوريون وردوده البشرية الذكية
            setTimeout(() => {
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot-message';
                botMsg.textContent = getSmartResponse(userText);
                messages.appendChild(botMsg);
                messages.scrollTop = messages.scrollHeight;
            }, 800);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
