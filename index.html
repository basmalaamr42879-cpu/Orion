<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion | أوريون - النظام الذكي</title>
    <!-- خط كاهيرو -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ألوان الموضة العصرية (الوضع الفاتح - Light Modern) */
        :root {
            --bg-canvas: #f4f6f9;
            --surface: #ffffff;
            --header-surface: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --bubble-bot: #f1f3f9;
            --bubble-bot-text: #1e293b;
            --bubble-user: #2563eb;
            --bubble-user-text: #ffffff;
            --input-bg: #f8fafc;
            --input-border: #cbd5e1;
            --input-focus: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.15);
            --border-line: #e2e8f0;
        }

        /* ألوان الموضة العصرية (الوضع المظلم - Dark Cyber/Clean) */
        [data-theme="dark"] {
            --bg-canvas: #090d16;
            --surface: #111827;
            --header-surface: #111827;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --bubble-bot: #1f2937;
            --bubble-bot-text: #f1f5f9;
            --bubble-user: #3b82f6;
            --bubble-user-text: #ffffff;
            --input-bg: #0f172a;
            --input-border: #374151;
            --input-focus: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.25);
            --border-line: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .orion-app {
            width: 100%;
            height: 100%;
            background-color: var(--surface);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* الهيدر العلوي */
        .app-header {
            background-color: var(--header-surface);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-line);
            z-index: 10;
        }

        .app-title {
            font-size: 19px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        .theme-btn {
            background: var(--bubble-bot);
            border: 1px solid var(--border-line);
            color: var(--text-primary);
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .theme-btn:hover {
            border-color: var(--input-focus);
        }

        /* منطقة الرسائل */
        .chat-stream {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .msg-box {
            max-width: 78%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .bot-reply {
            background-color: var(--bubble-bot);
            color: var(--bubble-bot-text);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-line);
        }

        .user-reply {
            background-color: var(--bubble-user);
            color: var(--bubble-user-text);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* خانة الإرسال (مضمونة ومثبتة بوضوح تام في الأسفل) */
        .input-wrapper {
            background-color: var(--header-surface);
            padding: 20px 24px;
            border-top: 1px solid var(--border-line);
            display: flex;
            gap: 12px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            align-items: center;
        }

        .input-wrapper input {
            flex: 1;
            background-color: var(--input-bg);
            border: 1.5px solid var(--input-border);
            color: var(--text-primary);
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-wrapper button {
            background-color: var(--bubble-user);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .input-wrapper button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="orion-app">
        <!-- الهيدر -->
        <div class="app-header">
            <div class="app-title">
                <span class="status-dot"></span>
                <span>أوريون | Orion AI</span>
            </div>
            <button class="theme-btn" onclick="toggleTheme()">☀️ الوضع الفاتح</button>
        </div>

        <!-- المحادثة -->
        <div class="chat-stream" id="chatStream">
            <div class="msg-box bot-reply">
                أهلاً بكِ يا بسملة. تم إعادة ضبط الهيكل بالكامل بأحدث ألوان الموضة العصرية وتثبيت خانة الإرسال والزر بوضوح تام في الأسفل. أنا جاهز لكل أوامرك!
            </div>
        </div>

        <!-- خانة الكتابة وزر الإرسال البارز -->
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="اكتب أمرك أو سؤالك هنا..." onkeypress="checkEnter(event)" />
            <button onclick="sendUserMessage()">إرسال</button>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const btn = document.querySelector('.theme-btn');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                btn.textContent = '🌙 الوضع المظلم';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️ الوضع الفاتح';
            }
        }

        function sendUserMessage() {
            const input = document.getElementById('userInput');
            const stream = document.getElementById('chatStream');
            const text = input.value.trim();

            if (!text) return;

            // رسالة المستخدم
            const userDiv = document.createElement('div');
            userDiv.className = 'msg-box user-reply';
            userDiv.textContent = text;
            stream.appendChild(userDiv);

            input.value = '';
            stream.scrollTop = stream.scrollHeight;

            // رد أوريون الذكي
            setTimeout(() => {
                const botDiv = document.createElement('div');
                botDiv.className = 'msg-box bot-reply';
                botDiv.textContent = `تم تنفيذ أمرك بنجاح يا بسملة وتحليل الرسالة: "${text}". النظام يعمل بكفاءة وألوان العصر الحديث.`;
                stream.appendChild(botDiv);
                stream.scrollTop = stream.scrollHeight;
            }, 700);
        }

        function checkEnter(e) {
            if (e.key === 'Enter') {
                sendUserMessage();
            }
        }
    </script>
</body>
</html>
