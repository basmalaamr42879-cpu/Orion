<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion AI - المساعد الذكي</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: rgba(30, 41, 59, 0.9);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .chat-header {
            background: #1e293b;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .chat-header h2 {
            margin: 0;
            color: #38bdf8;
            font-size: 20px;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
        }
        .ai-message {
            background: #334155;
            align-self: flex-start;
            color: #f8fafc;
        }
        .user-message {
            background: #0284c7;
            align-self: flex-end;
            color: white;
        }
        .chat-input-area {
            padding: 15px;
            background: #1e293b;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: #0f172a;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .chat-input-area input:focus {
            border-color: #38bdf8;
        }
        .chat-input-area button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .chat-input-area button:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>Orion AI</h2>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">مرحباً بك، أنا أوريون مساعدك الذكي.</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="اكتب سؤالك أو أمرك للشركة هنا..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messagesContainer = document.getElementById('chatMessages');
            const messageText = inputField.value.trim();

            if (messageText === '') return;

            // إظهار رسالة المستخدم
            const userDiv = document.createElement('div');
            userDiv.classList.add('message', 'user-message');
            userDiv.textContent = messageText;
            messagesContainer.appendChild(userDiv);

            inputField.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // رسالة جاري التحليل
            const aiDiv = document.createElement('div');
            aiDiv.classList.add('message', 'ai-message');
            aiDiv.textContent = "جاري تحليل المدخلات...";
            messagesContainer.appendChild(aiDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // تحليل ذكي محلي بناءً على الكلمات المفتاحية
            setTimeout(() => {
                const text = messageText.toLowerCase();

                if (text.includes("من صنعك") || text.includes("مين اللى عاملك") || text.includes("مبرمجه")) {
                    aiDiv.textContent = "تم تصميمي وبرمجتي بواسطة بسملة.";
                } 
                else if (text.includes("خدمات") || text.includes("الشركة") || text.includes("شغلنا")) {
                    aiDiv.textContent = "نظام أوريون مصمم لمساعدة شركتك في تنظيم المهام، تحليل البيانات، وتقديم دعم سريع ومباشر.";
                }
                else if (text.includes("مرحبا") || text.includes("ازيك") || text.includes("السلام")) {
                    aiDiv.textContent = "أهلاً بك! أنا جاهز لتلقي أوامرك وتحليل البيانات المطلوبة.";
                }
                else {
                    aiDiv.textContent = `تم استقبال وتحليل الأمر بنجاح: "${messageText}". النظام يعمل محلياً بكفاءة وجاهز لتنفيذ المهام المخصصة.`;
                }

                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 800);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
