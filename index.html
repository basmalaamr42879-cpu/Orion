<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion | أوريون - صديقك الرقمي</title>
    <!-- استيراد خط كاهيرو -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* إعدادات الألوان الافتراضية (الوضع الفاتح Light Mode) */
        :root {
            --bg-color: #f8fafc;
            --container-bg: #ffffff;
            --header-bg: linear-gradient(135deg, #4f46e5, #3b82f6);
            --header-text: #ffffff;
            --text-color: #1e293b;
            --bot-msg-bg: #f1f5f9;
            --bot-text-color: #1e293b;
            --user-msg-bg: #4f46e5;
            --user-text-color: #ffffff;
            --input-bg: #f8fafc;
            --input-border: #cbd5e1;
            --input-text: #1e293b;
            --shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            --border-color: rgba(0, 0, 0, 0.05);
        }

        /* إعدادات الوضع المظلم (Dark Mode) لما يتم تفعيله */
        [data-theme="dark"] {
            --bg-color: #0b0f19;
            --container-bg: #1e1e2f;
            --header-bg: linear-gradient(135deg, #4f46e5, #3b82f6);
            --header-text: #ffffff;
            --text-color: #f1f5f9;
            --bot-msg-bg: #2a2b42;
            --bot-text-color: #e2e8f0;
            --user-msg-bg: #4f46e5;
            --user-text-color: #ffffff;
            --input-bg: #1e1e2f;
            --input-border: #334155;
            --input-text: #f1f5f9;
            --shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            --border-color: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            max-height: 700px;
            background-color: var(--container-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .chat-header {
            background: var(--header-bg);
            color: var(--header-text);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
        }
        .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .bot-message {
            background-color: var(--bot-msg-bg);
            color: var(--bot-text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .user-message {
            background-color: var(--user-msg-bg);
            color: var(--user-text-color);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            background-color: var(--container-bg);
            border-top: 1px solid var(--border-color);
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            background-color: var(--input-bg);
            color: var(--input-text);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            outline: none;
        }
        .chat-input-area input:focus {
            border-color: #4f46e5;
        }
        .chat-input-area button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 14px;
        }
        .chat-input-area button:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body data-theme="dark"> <!-- الديفولت هنا مظلم، وممكن المستخدم يغيره -->

    <div class="chat-container">
        <div class="chat-header">
            <span>🌌 أوريون (Orion)</span>
            <button class="theme-toggle-btn" onclick="toggleTheme()">☀️ الوضع الفاتح</button>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">أهلاً بيكِ يا بسملة! أنا أوريون، صديقك الرقمي. جربي تضغطي على زرار تغيير الوضع فوق، وقوليلي حابة نتكلم في إيه؟</div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)" />
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        // وظيفة تبديل الثيم بين المظلم والفاتح
        function toggleTheme() {
            const body = document.body;
            const btn = document.querySelector('.theme-toggle-btn');
            
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                btn.textContent = '🌙 الوضع المظلم';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️ الوضع الفاتح';
            }
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const messages = document.getElementById('chatMessages');
            
            if (input.value.trim() === "") return;

            // رسالة المستخدم
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = input.value;
            messages.appendChild(userMsg);

            let userText = input.value;
            input.value = "";
            messages.scrollTop = messages.scrollHeight;

            // رد مؤقت تفاعلي لحد ما نطور الذكاء أكتر
            setTimeout(() => {
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot-message';
                botMsg.textContent = "وصلتني رسالتك: \"" + userText + "\". أنا بتطور خطوة بخطوة معاكي!";
                messages.appendChild(botMsg);
                messages.scrollTop = messages.scrollHeight;
            }, 1000);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
