<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion | أوريون - المساعد الذكي</title>
    <!-- استيراد خط كاهيرو -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* الألوان الهادئة والمريحة للعين (الوضع الفاتح) */
        :root {
            --bg-color: #f1f5f9;
            --container-bg: #ffffff;
            --header-bg: #ffffff;
            --header-text: #0f172a;
            --text-color: #334155;
            --bot-msg-bg: #f8fafc;
            --bot-text-color: #1e293b;
            --user-msg-bg: #4f46e5;
            --user-text-color: #ffffff;
            --input-bg: #f8fafc;
            --input-border: #e2e8f0;
            --input-text: #0f172a;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
            --border-color: #e2e8f0;
        }

        /* الألوان الهادئة والمريحة للعين (الوضع المظلم) */
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --header-bg: #1e293b;
            --header-text: #f8fafc;
            --text-color: #cbd5e1;
            --bot-msg-bg: #334155;
            --bot-text-color: #f1f5f9;
            --user-msg-bg: #6366f1;
            --user-text-color: #ffffff;
            --input-bg: #0f172a;
            --input-border: #475569;
            --input-text: #f8fafc;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.25s, color 0.25s, border-color 0.25s;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            height: 100%;
            background-color: var(--container-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 18px;
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .header-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .status-indicator {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        .theme-toggle-btn {
            background: var(--bot-msg-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
        }

        .theme-toggle-btn:hover {
            opacity: 0.85;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 14.5px;
            line-height: 1.6;
            word-wrap: break-word;
            box-shadow: var(--shadow);
        }

        .bot-message {
            background-color: var(--bot-msg-bg);
            color: var(--bot-text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .user-message {
            background-color: var(--user-msg-bg);
            color: var(--user-text-color);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background-color: var(--bot-msg-bg);
            padding: 12px 16px;
            border-radius: 14px;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
            gap: 5px;
            align-items: center;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: #818cf8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* حاوية الإرسال ثابتة وواضحة جداً في الأسفل */
        .chat-input-area {
            display: flex;
            padding: 18px 24px;
            background-color: var(--container-bg);
            border-top: 1px solid var(--border-color);
            gap: 12px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .chat-input-area input {
            flex: 1;
            padding: 13px 18px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            background-color: var(--input-bg);
            color: var(--input-text);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: #6366f1;
        }

        .chat-input-area button {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 14px;
        }

        .chat-input-area button:hover {
            background-color: #4f46e5;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-info">
                <span>أوريون | Orion</span>
                <span class="status-indicator"><span class="status-dot"></span>جاهز للعمل (HTML, CSS, JS, Python)</span>
            </div>
            <button class="theme-toggle-btn" onclick="toggleTheme()">☀️ تبديل الوضع</button>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">أهلاً بكِ يا بسملة. تم تحديث التصميم ليصبح مريحاً للعين، وأصبحت قادراً على مناقشة لغات البرمجة (Python, JavaScript, HTML, CSS). اسألي في أي لغة تريدينها!</div>
            
            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="اسألي عن بايثون، جافاسكريبت، أو ادردشي معي..." onkeypress="handleKeyPress(event)" />
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const btn = document.querySelector('.theme-toggle-btn');
            
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                btn.textContent = '🌙 تبديل الوضع';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️ تبديل الوضع';
            }
        }

        // عقل ذكي يفهم لغات البرمجة المختلفة (Python, JS, CSS, HTML)
        function getProgrammingAIResponse(query) {
            query = query.toLowerCase();

            if (query.includes('python') || query.includes('بايثون')) {
                return "لغة بايثون رائعة وسهلة جداً! تُستخدم في الذكاء الاصطناعي، تحليل البيانات، وتطوير الويب. هل تريدين كتابة كود بلغة بايثون معكِ الآن؟";
            } else if (query.includes('javascript') || query.includes('جافا اسكريبت') || query.includes('js')) {
                return "جافاسكريبت هي روح تفاعل صفحات الويب (زي الكود اللي بنبنيه بيه دلوقتي ده)! بتقدر تخلي الموقع يتحرك ويفاعل المستخدم بطريقة مذهلة.";
            } else if (query.includes('css') || query.includes('تصميم') || query.includes('ألوان')) {
                return "الـ CSS هو المسؤول عن جمال وسحر الموقع، زي الأרגونا أو المظهر اللي بيظهر قدامك دلوقتي وتنسيق الألوان والخطوط.";
            } else if (query.includes('html')) {
                return "الـ HTML هو الهيكل العظمي لأي صفحة ويب، بيحدد العناصر الأساسية زي النصوص والأزرار والمربعات.";
            } else {
                return "معكِ يا بسملة، لقد فهمت سؤالكِ بدقة. هل ترغبين في دمج لغات البرمجة هذه معاً لتطوير مشروع أوريون أكثر تقدماً؟";
            }
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const messages = document.getElementById('chatMessages');
            const typingIndicator = document.getElementById('typingIndicator');
            
            if (input.value.trim() === "") return;

            // رسالة المستخدم
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = input.value;
            messages.appendChild(userMsg);

            let userText = input.value;
            input.value = "";
            
            // إظهار مؤشر الكتابة
            messages.appendChild(typingIndicator);
            typingIndicator.style.display = 'flex';
            messages.scrollTop = messages.scrollHeight;

            // الرد الذكي بعد ثوانٍ قليلة
            setTimeout(() => {
                typingIndicator.style.display = 'none';

                const botMsg = document.createElement('div');
                botMsg.className = 'message bot-message';
                botMsg.textContent = getProgrammingAIResponse(userText);
                
                messages.insertBefore(botMsg, typingIndicator);
                messages.scrollTop = messages.scrollHeight;
            }, 1200);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
